announcement:
  text: Our new website is live. The offseason calendar of workouts and team activities is posted.
  link: /calendar/
  linkText: See the calendar

contact:
  headCoach: Coach Devon Bolling
  email: bollind.devon@rrcs.org

field:
  name: The Bus Yard (Varsity field)
  address: Rocky River High School, 20951 Detroit Road, Rocky River, OH 44116
  mapUrl: https://www.google.com/maps/search/?api=1&query=20951+Detroit+Road+Rocky+River+OH+44116

social:
  - label: River Diamond Club on Instagram
    url: https://www.instagram.com/riverdiamondclub/
  - label: River Diamond Club on X
    url: https://www.x.com/RRDiamondClub

boosterClub:
  name: River Diamond Club
  url: https://riverdiamondclub.com/
  blurb: >-
    The River Diamond Club supports Rocky River baseball from Little League
    through varsity and raises the funds that cover program expenses the
    school system does not.

values:
  - name: Preparation
    text: We earn confidence through how we work before the game starts.
  - name: Competition
    text: Every rep, every drill, every inning is a chance to compete.
  - name: Accountability
    text: We own our actions, our effort and our results.
  - name: Energy
    text: We bring it every day, for ourselves and for each other.
  - name: Development
    text: Better players and better people, one day at a time.
  - name: Teamwork
    text: The team comes first, on the field and off it.
  - name: Embrace the Grind
    text: The work nobody sees is what shows up in the spring.

