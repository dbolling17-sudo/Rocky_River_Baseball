programName: Rocky River Baseball
schoolName: Rocky River High School
mascot: Pirates
city: Rocky River, Ohio
tagline: Prepare. Compete. Embrace the grind.
description: >-
  The official home of Rocky River High School Baseball: schedules, results,
  rosters, news and program information for players, families, alumni and the
  Rocky River community.

# Logo file inside src/assets/photos/: the Rocky River Pirates logo Coach Bolling
