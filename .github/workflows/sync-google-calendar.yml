# Copies the team Google Calendar onto the website about once an hour.
# If anything changed, it commits src/data/calendar/google-calendar.yaml and
# Cloudflare rebuilds the site. The site is built first as a check, so a broken
# feed never replaces the live calendar.
name: Sync Google Calendar

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-google-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node tools/sync-google-calendar.mjs
      - name: Commit if the calendar changed
        run: |
          git add src/data/calendar/google-calendar.yaml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Calendar unchanged."
            exit 0
          fi
          npm run build
          git config user.name "Calendar sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update calendar from Google Calendar"
          git push
